name: Desktop Build

on:
  push:
    branches:
      - desktop-linux
    paths:
      - shared/**
      - desktop/**
      - innertube/**
      - app/**
      - gradle/**
      - settings.gradle.kts
      - gradle.properties
      - .github/workflows/desktop.yml
  pull_request:
    paths:
      - shared/**
      - desktop/**
      - innertube/**
      - app/**
      - gradle/**
      - settings.gradle.kts
      - gradle.properties
      - .github/workflows/desktop.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Shared tests + Desktop build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run shared tests
        run: ./gradlew :shared:jvmTest --configure-on-demand --console=plain --warning-mode summary

      - name: Run innertube JVM tests
        run: ./gradlew :innertube:jvmTest --configure-on-demand --console=plain --warning-mode summary

      - name: Build desktop app
        run: ./gradlew :desktop:build --configure-on-demand --console=plain --warning-mode summary -x test

  android-baseline:
    name: Android baseline (app still builds)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install platform and build-tools
        run: |
          : "${ANDROID_HOME:=/usr/local/lib/android/sdk}"
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v -keystore app/persistent-debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Assemble FOSS debug
        run: ./gradlew :app:assembleFossDebug --console=plain --warning-mode summary
